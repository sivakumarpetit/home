<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Family Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏡 Our Home Dashboard</h1>
    <span id="sync-status">connecting…</span>
  </header>

  <nav>
    <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">📋 Tasks</button>
    <button class="tab-btn" id="tab-shopping" onclick="switchTab('shopping')">🛒 Shopping</button>
    <button class="tab-btn" id="tab-meals" onclick="switchTab('meals')">🍳 Meals</button>
  </nav>

  <section id="section-tasks" class="tab-content active">
    <div class="task-cols">
      <div class="task-col" data-column="today">
        <h3>Today <small id="count-today">0</small></h3>
        <ul class="task-list" id="list-today"></ul>
      </div>
      <div class="task-col" data-column="week">
        <h3>This Week <small id="count-week">0</small></h3>
        <ul class="task-list" id="list-week"></ul>
      </div>
      <div class="task-col" data-column="someday">
        <h3>Someday <small id="count-someday">0</small></h3>
        <ul class="task-list" id="list-someday"></ul>
      </div>
    </div>
    <div class="add-row">
      <input id="task-input" type="text" placeholder="Add a task…" onkeydown="if(event.key==='Enter'){addTask();}">
      <select id="task-column">
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="someday">Someday</option>
      </select>
      <button type="button" onclick="addTask()">Add</button>
    </div>

    <!-- Hideable Completed Tasks Archive -->
    <div class="archive-wrap">
      <div class="archive-header" onclick="toggleArchiveVisibility()">
        <h3>📦 Completed Archive (<span id="count-archive">0</span>)</h3>
        <button type="button" class="archive-toggle-btn" id="archive-toggle-btn">▼ Hide</button>
      </div>
      <div id="archive-content" class="archive-content">
        <div id="archive-list-container"></div>
      </div>
    </div>
  </section>

  <section id="section-shopping" class="tab-content">
    <div class="shop-grid" id="shopping-grid"></div>
    <div class="add-store-row">
      <input id="new-store-input" type="text" placeholder="New store name…" onkeydown="if(event.key==='Enter'){addStore();}">
      <button type="button" onclick="addStore()">+ Add store</button>
    </div>
  </section>

  <section id="section-meals" class="tab-content">
    <div class="meal-table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead>
        <tbody id="meal-table-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
