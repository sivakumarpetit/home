<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Family Dashboard</title>

  <!-- PWA Manifest & Custom App Icons -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5c6b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="apple-touch-icon" href="/home/icon.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- PIN Entry Gate Overlay -->
<div id="pin-overlay" class="pin-overlay">
  <div class="pin-card">
    <h2>🔐 Access Required</h2>
    <p>Please enter your PIN to view the family dashboard.</p>
    <div class="pin-input-group">
      <input type="password" id="pin-input" placeholder="Enter PIN…" onkeydown="if(event.key==='Enter'){verifyPin();}">
      <button type="button" onclick="verifyPin()">Unlock</button>
    </div>
    <p id="pin-error" class="pin-error"></p>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>🏡 Our Home Dashboard</h1>
    <div class="header-right">
      <span id="sync-status">connecting…</span>
      <button type="button" class="lock-btn" onclick="lockDashboard()" title="Lock Dashboard">🔒 Lock</button>
    </div>
  </header>

  <nav>
    <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">📋 Tasks</button>
    <button class="tab-btn" id="tab-shopping" onclick="switchTab('shopping')">🛒 Shopping</button>
    <button class="tab-btn" id="tab-meals" onclick="switchTab('meals')">🍳 Meals</button>
  </nav>

  <section id="section-tasks" class="tab-content active">
    <!-- Master User Filter Bar -->
    <div class="filter-bar">
      <span>Filter Tasks:</span>
      <button class="filter-btn active" id="filter-all" onclick="setTaskFilter('all')">All</button>
      <button class="filter-btn filter-siva" id="filter-siva" onclick="setTaskFilter('Siva')">Siva</button>
      <button class="filter-btn filter-priya" id="filter-priya" onclick="setTaskFilter('Priya')">Priya</button>
      <button class="filter-btn" id="filter-none" onclick="setTaskFilter('none')">Unassigned</button>
    </div>

    <!-- Quick Templates Picker -->
    <div class="template-picker">
      <span class="template-title">⚡ Quick Add Today:</span>
      <div class="template-pills" id="template-pills"></div>
    </div>

    <div class="task-cols">
      <div class="task-col" data-column="today">
        <h3>Today <small id="count-today">0</small></h3>
        <ul class="task-list" id="list-today"></ul>
      </div>
      <div class="task-col" data-column="week">
        <h3>This Week <small id="count-week">0</small></h3>
        <ul class="task-list" id="list-week"></ul>
      </div>
      <div class="task-col" data-column="someday">
        <h3>Someday <small id="count-someday">0</small></h3>
        <ul class="task-list" id="list-someday"></ul>
      </div>
    </div>

    <div class="add-row">
      <input id="task-input" type="text" placeholder="Add a task…" onkeydown="if(event.key==='Enter'){addTask();}">
      <select id="task-assignee">
        <option value="">No Assignee</option>
        <option value="Siva">Siva</option>
        <option value="Priya">Priya</option>
      </select>
      <select id="task-column">
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="someday">Someday</option>
      </select>
      <button type="button" onclick="addTask()">Add</button>
    </div>

    <!-- Hideable Completed Tasks Archive -->
    <div class="archive-wrap">
      <div class="archive-header" onclick="toggleArchiveVisibility()">
        <h3>📦 Completed Archive (<span id="count-archive">0</span>)</h3>
        <button type="button" class="archive-toggle-btn" id="archive-toggle-btn">▼ Hide</button>
      </div>
      <div id="archive-content" class="archive-content">
        <div id="archive-list-container"></div>
      </div>
    </div>
  </section>

  <section id="section-shopping" class="tab-content">
    <div class="shop-grid" id="shopping-grid"></div>
    <div class="add-store-row">
      <input id="new-store-input" type="text" placeholder="New store name…" onkeydown="if(event.key==='Enter'){addStore();}">
      <button type="button" onclick="addStore()">+ Add store</button>
    </div>
  </section>

  <section id="section-meals" class="tab-content">
    <div class="meal-table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead>
        <tbody id="meal-table-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
