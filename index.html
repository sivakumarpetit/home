<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Dashboard</title>
<style>
  :root{
    --ink:#2b2a28;
    --paper:#faf7f2;
    --card:#ffffff;
    --line:#e4ddd0;
    --olive:#5c6b4a;
    --olive-dark:#3f4a33;
    --clay:#b5673b;
    --muted:#8a8377;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Georgia',serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:960px;margin:0 auto;padding:36px 24px 80px;}
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:24px;
  }
  header h1{font-size:28px;margin:0;font-weight:600;letter-spacing:0.2px;}
  header span{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--muted);}
  nav{display:flex;gap:6px;margin-bottom:28px;}
  .tab-btn{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13.5px;
    padding:9px 18px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--muted);
    cursor:pointer;
    border-radius:3px;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{border-color:var(--olive);color:var(--olive-dark);}
  .tab-btn.active{background:var(--olive);border-color:var(--olive);color:#fff;}
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* TASKS */
  .task-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .task-col{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px;
    min-height:120px;
    transition:background .12s ease, border-color .12s ease;
  }
  .task-col.drop-hover{background:#f0f4ea;border-color:var(--olive);}
  .task-col h3{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;
    color:var(--olive-dark);
    margin:0;
    display:flex;
    justify-content:space-between;
  }
  .task-col h3 small{color:var(--muted);font-weight:400;}
  ul.task-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:20px;}
  .task-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 8px 8px 4px;border:1px solid var(--line);border-radius:3px;
    font-size:14px;background:#fff;gap:4px;
  }
  .task-item.done{text-decoration:line-through;color:var(--muted);background:#f5f3ee;}
  .task-item.dragging{opacity:0.35;}
  .drag-handle{cursor:grab;color:var(--muted);font-size:15px;padding:2px 6px;touch-action:none;user-select:none;line-height:1;}
  .drag-handle:active{cursor:grabbing;}
  .task-item label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0;}
  .task-item label span{overflow-wrap:anywhere;}
  .task-item button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;}
  .task-item button:hover{color:var(--clay);}
  .add-row{display:flex;gap:6px;margin-top:12px;}
  .add-row input, .add-row select{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;padding:7px 9px;
    border:1px solid var(--line);border-radius:3px;background:#fff;
  }
  .add-row input{flex:1;}
  .add-row button{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;padding:7px 14px;
    border:none;border-radius:3px;background:var(--olive);color:#fff;cursor:pointer;
  }
  .add-row button:hover{background:var(--olive-dark);}

  .ghost-card{
    position:fixed;z-index:999;pointer-events:none;opacity:0.9;
    box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:3px;background:#fff;border:1px solid var(--olive);
  }

  /* SHOPPING */
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:18px;}
  .shop-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;}
  .shop-card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;}
  .store-name{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--olive-dark);
    font-weight:600;outline:none;border-bottom:1px dashed transparent;padding:2px 3px;
    flex:1;min-width:0;cursor:text;
  }
  .store-name:hover{border-bottom-color:var(--line);}
  .store-name:focus{border-bottom-color:var(--olive);background:#f7f4ee;}
  .remove-store-btn{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;flex-shrink:0;
  }
  .remove-store-btn:hover{color:var(--clay);}
  .shop-card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .shop-item{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:6px 8px;border-radius:3px;background:#f7f4ee;}
  .shop-item.checked{text-decoration:line-through;color:var(--muted);opacity:.65;}
  .shop-item label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .shop-add{display:flex;gap:5px;margin-top:10px;}
  .shop-add input{flex:1;font-size:12.5px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;}
  .shop-add button{border:none;background:var(--clay);color:#fff;border-radius:3px;padding:6px 10px;cursor:pointer;font-size:12.5px;}
  .clear-btn{font-size:11px;color:var(--olive);background:none;border:none;cursor:pointer;margin-top:8px;padding:0;}
  .add-store-row{display:flex;gap:6px;}
  .add-store-row input{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;padding:8px 10px;
    border:1px dashed var(--line);border-radius:3px;background:#fff;flex:0 0 220px;
  }
  .add-store-row button{
    font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;padding:8px 14px;
    border:none;border-radius:3px;background:var(--olive);color:#fff;cursor:pointer;
  }
  .add-store-row button:hover{background:var(--olive-dark);}

  /* MEALS */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);}
  th{font-family:'Helvetica Neue',Arial,sans-serif;font-size:12px;color:var(--olive-dark);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);}
  td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  td:first-child{font-weight:600;background:#f5f3ee;width:110px;}
  td input{width:100%;border:none;background:transparent;font-family:inherit;font-size:13.5px;padding:4px 2px;}
  td input:focus{outline:1px solid var(--olive);border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏡 Our Home Dashboard</h1>
    <span>tasks · shopping · meals</span>
  </header>

  <nav>
    <button class="tab-btn active" id="tab-tasks" onclick="switchTab('tasks')">📋 Tasks</button>
    <button class="tab-btn" id="tab-shopping" onclick="switchTab('shopping')">🛒 Shopping</button>
    <button class="tab-btn" id="tab-meals" onclick="switchTab('meals')">🍳 Meals</button>
  </nav>

  <section id="section-tasks" class="tab-content active">
    <div class="task-cols">
      <div class="task-col" data-column="today">
        <h3>Today <small id="count-today">0</small></h3>
        <ul class="task-list" id="list-today"></ul>
      </div>
      <div class="task-col" data-column="week">
        <h3>This Week <small id="count-week">0</small></h3>
        <ul class="task-list" id="list-week"></ul>
      </div>
      <div class="task-col" data-column="someday">
        <h3>Someday <small id="count-someday">0</small></h3>
        <ul class="task-list" id="list-someday"></ul>
      </div>
    </div>
    <div class="add-row">
      <input id="task-input" type="text" placeholder="Add a task…" onkeydown="if(event.key==='Enter'){addTask();}">
      <select id="task-column">
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="someday">Someday</option>
      </select>
      <button type="button" onclick="addTask()">Add</button>
    </div>
  </section>

  <section id="section-shopping" class="tab-content">
    <div class="shop-grid" id="shopping-grid"></div>
    <div class="add-store-row">
      <input id="new-store-input" type="text" placeholder="New store name…" onkeydown="if(event.key==='Enter'){addStore();}">
      <button type="button" onclick="addStore()">+ Add store</button>
    </div>
  </section>

  <section id="section-meals" class="tab-content">
    <table>
      <thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead>
      <tbody id="meal-table-body"></tbody>
    </table>
  </section>
</div>

<script>
// In-memory state, local to this browser for now.
// TODO(firebase): replace loadState()/scheduleSave() bodies below with
// Firestore reads/writes once Firebase is connected, for real cross-device sync.
let state = {
  tasks: [],
  storeOrder: ['Grocery','Costco','Indian','Amazon','Walmart'],
  shopping: { Grocery: [], Costco: [], Indian: [], Amazon: [], Walmart: [] },
  meals: {}
};
const daysOfWeek = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const mealTypes = ['breakfast','lunch','dinner'];

function loadState(){
  initMealsState();
  renderAll();
}

// No-op until Firebase is wired in — every mutation function below already
// calls this, so once you add Firestore writes here, saving "just works".
function scheduleSave(){}

function switchTab(tabId){
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('section-'+tabId).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('tab-'+tabId).classList.add('active');
}

// --- TASKS ---
function addTask(){
  const textInput = document.getElementById('task-input');
  const colSelect = document.getElementById('task-column');
  const text = textInput.value.trim();
  if(!text) return;
  state.tasks.push({ id: Date.now()+Math.random(), text, column: colSelect.value, completed:false });
  textInput.value = '';
  textInput.focus();
  renderTasks();
  scheduleSave();
}
function toggleTask(id){
  state.tasks = state.tasks.map(t => t.id===id ? {...t, completed:!t.completed} : t);
  renderTasks();
  scheduleSave();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(t => t.id!==id);
  renderTasks();
  scheduleSave();
}
function moveTask(id, newColumn, beforeId){
  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const [task] = state.tasks.splice(idx,1);
  task.column = newColumn;
  if(beforeId!=null){
    const beforeIdx = state.tasks.findIndex(t=>t.id===beforeId);
    if(beforeIdx!==-1){ state.tasks.splice(beforeIdx,0,task); return; }
  }
  state.tasks.push(task);
}

function renderTasks(){
  ['today','week','someday'].forEach(col=>{
    const listEl = document.getElementById('list-'+col);
    const countEl = document.getElementById('count-'+col);
    const filtered = state.tasks.filter(t=>t.column===col);
    countEl.innerText = filtered.length;
    listEl.innerHTML = '';
    filtered.forEach(task=>{
      const li = document.createElement('li');
      li.className = 'task-item' + (task.completed ? ' done' : '');
      li.dataset.id = task.id;
      li.innerHTML = `
        <span class="drag-handle">⠿⠿</span>
        <label onclick="toggleTask(${task.id})">
          <input type="checkbox" ${task.completed?'checked':''} onclick="event.stopPropagation(); toggleTask(${task.id})">
          <span>${escapeHtml(task.text)}</span>
        </label>
        <button onclick="deleteTask(${task.id})">✕</button>
      `;
      listEl.appendChild(li);
      const handle = li.querySelector('.drag-handle');
      handle.addEventListener('pointerdown', (e)=>startDrag(e, task.id, li));
    });
  });
}

// --- Drag & drop (mouse + touch, via Pointer Events) ---
let dragState = null;

function startDrag(e, taskId, li){
  e.preventDefault();
  const rect = li.getBoundingClientRect();
  const ghost = li.cloneNode(true);
  ghost.classList.add('ghost-card');
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  li.classList.add('dragging');

  dragState = {
    taskId, li, ghost,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    lastCol: null
  };

  const handle = e.target;
  handle.setPointerCapture(e.pointerId);
  handle.addEventListener('pointermove', onDragMove);
  handle.addEventListener('pointerup', onDragEnd);
  handle.addEventListener('pointercancel', onDragEnd);
}

function onDragMove(e){
  if(!dragState) return;
  const { ghost, offsetX, offsetY } = dragState;
  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top = (e.clientY - offsetY) + 'px';

  ghost.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  ghost.style.display = '';

  document.querySelectorAll('.task-col').forEach(c=>c.classList.remove('drop-hover'));
  const col = under ? under.closest('.task-col') : null;
  if(col){
    col.classList.add('drop-hover');
    dragState.lastCol = col.dataset.column;
  }
}

function onDragEnd(e){
  if(!dragState) return;
  const { taskId, li, ghost } = dragState;
  const handle = e.target;
  handle.removeEventListener('pointermove', onDragMove);
  handle.removeEventListener('pointerup', onDragEnd);
  handle.removeEventListener('pointercancel', onDragEnd);

  document.querySelectorAll('.task-col').forEach(c=>c.classList.remove('drop-hover'));
  ghost.remove();
  li.classList.remove('dragging');

  if(dragState.lastCol){
    ghost.style.display = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const targetLi = under ? under.closest('.task-item') : null;
    const beforeId = (targetLi && Number(targetLi.dataset.id) !== taskId) ? Number(targetLi.dataset.id) : null;
    moveTask(taskId, dragState.lastCol, beforeId);
  }
  dragState = null;
  renderTasks();
  scheduleSave();
}

// --- SHOPPING (customizable stores) ---
function addStore(){
  const input = document.getElementById('new-store-input');
  const name = input.value.trim();
  if(!name) return;
  if(state.storeOrder.includes(name)){
    input.value = '';
    return;
  }
  state.storeOrder.push(name);
  state.shopping[name] = [];
  input.value = '';
  renderShopping();
  scheduleSave();
}
function removeStore(name){
  state.storeOrder = state.storeOrder.filter(s => s!==name);
  delete state.shopping[name];
  renderShopping();
  scheduleSave();
}
function renameStore(oldName, newNameRaw){
  const newName = newNameRaw.trim();
  if(!newName || newName === oldName) { renderShopping(); return; }
  if(state.storeOrder.includes(newName)){
    // name collision: merge items into existing store, drop the old one
    state.shopping[newName] = [...(state.shopping[newName]||[]), ...(state.shopping[oldName]||[])];
    state.storeOrder = state.storeOrder.filter(s=>s!==oldName);
    delete state.shopping[oldName];
  } else {
    const idx = state.storeOrder.indexOf(oldName);
    if(idx!==-1) state.storeOrder[idx] = newName;
    state.shopping[newName] = state.shopping[oldName] || [];
    if(newName!==oldName) delete state.shopping[oldName];
  }
  renderShopping();
  scheduleSave();
}
function addShoppingItem(store, inputEl){
  const text = inputEl.value.trim();
  if(!text) return;
  state.shopping[store].push({ id: Date.now()+Math.random(), text, checked:false });
  inputEl.value = '';
  renderShopping();
  scheduleSave();
}
function toggleShoppingItem(store, id){
  state.shopping[store] = state.shopping[store].map(it => it.id===id ? {...it, checked:!it.checked} : it);
  renderShopping();
  scheduleSave();
}
function clearCheckedShopping(store){
  state.shopping[store] = state.shopping[store].filter(it=>!it.checked);
  renderShopping();
  scheduleSave();
}
function renderShopping(){
  const grid = document.getElementById('shopping-grid');
  grid.innerHTML = '';
  state.storeOrder.forEach(store=>{
    const card = document.createElement('div');
    card.className = 'shop-card';
    const items = state.shopping[store] || [];
    let itemsHtml = items.map(item=>`
      <li class="shop-item ${item.checked?'checked':''}">
        <label onclick="toggleShoppingItem('${store}', ${item.id})">
          <input type="checkbox" ${item.checked?'checked':''} onclick="event.stopPropagation(); toggleShoppingItem('${store}', ${item.id})">
          ${escapeHtml(item.text)}
        </label>
      </li>
    `).join('');
    card.innerHTML = `
      <div class="shop-card-head">
        <span class="store-name" contenteditable="true" spellcheck="false"
          onblur="renameStore('${store}', this.innerText)"
          onkeydown="if(event.key==='Enter'){event.preventDefault(); this.blur();}">${escapeHtml(store)}</span>
        <button class="remove-store-btn" title="Remove store" onclick="removeStore('${store}')">✕</button>
      </div>
      <ul>${itemsHtml}</ul>
      ${items.some(i=>i.checked) ? `<button class="clear-btn" onclick="clearCheckedShopping('${store}')">🧹 Clear checked</button>` : ''}
      <div class="shop-add">
        <input type="text" placeholder="Add item…" onkeydown="if(event.key==='Enter'){addShoppingItem('${store}', this);}">
        <button type="button" onclick="addShoppingItem('${store}', this.previousElementSibling)">Add</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// --- MEALS ---
function initMealsState(){
  daysOfWeek.forEach(day=>{
    if(!state.meals[day]) state.meals[day] = { breakfast:'', lunch:'', dinner:'' };
  });
}
function updateMeal(day, type, value){
  state.meals[day][type] = value;
  scheduleSave();
}
function renderMeals(){
  const tbody = document.getElementById('meal-table-body');
  tbody.innerHTML = '';
  daysOfWeek.forEach(day=>{
    const row = document.createElement('tr');
    let rowHtml = `<td>${day}</td>`;
    mealTypes.forEach(type=>{
      const val = state.meals[day][type] || '';
      rowHtml += `<td><input type="text" value="${escapeHtml(val)}" oninput="updateMeal('${day}','${type}', this.value)"></td>`;
    });
    row.innerHTML = rowHtml;
    tbody.appendChild(row);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}

function renderAll(){
  renderTasks();
  renderShopping();
  renderMeals();
}

loadState();
</script>
</body>
</html>
